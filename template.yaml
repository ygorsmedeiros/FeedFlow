AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FeedFlow Sprint 5 - API, DynamoDB Stream e alertas criticos via SNS

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{1,14}$'
    Description: Identificador curto do ambiente.

  FeedbackTableName:
    Type: String
    Default: FeedFlowFeedback
    AllowedPattern: '^[A-Za-z0-9_.-]{3,255}$'
    Description: Nome da tabela de avaliacoes.

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
    Description: Retencao dos logs da Lambda no CloudWatch Logs.

Resources:
  FeedFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub '${AWS::StackName}-http-api'
      StageName: '$default'
      FailOnWarnings: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  FeedFlowFeedbackTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Ref FeedbackTableName
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: weekKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byWeek
          KeySchema:
            - AttributeName: weekKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      Tags:
        - Key: Application
          Value: FeedFlow
        - Key: Environment
          Value: !Ref EnvironmentName

  FeedFlowApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: FeedFlow
        - Key: Environment
          Value: !Ref EnvironmentName

  FeedFlowNotificationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-notifications'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: FeedFlow
        - Key: Environment
          Value: !Ref EnvironmentName

  FeedFlowCriticalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-critical-alerts'
      DisplayName: FeedFlow Critical Alerts
      Tags:
        - Key: Application
          Value: FeedFlow
        - Key: Environment
          Value: !Ref EnvironmentName

  FeedFlowNotificationsFailureQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${AWS::StackName}-notifications-failures'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Application
          Value: FeedFlow
        - Key: Environment
          Value: !Ref EnvironmentName

  FeedFlowApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Funcao de execucao exclusiva da Lambda API do FeedFlow.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: FeedFlowApiDynamoDbAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteAndReadFeedbackById
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt FeedFlowFeedbackTable.Arn
              - Sid: QueryFeedbackByWeek
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub '${FeedFlowFeedbackTable.Arn}/index/byWeek'
        - PolicyName: FeedFlowApiCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-api:log-stream:*'
      Tags:
        - Key: Application
          Value: FeedFlow
        - Key: Environment
          Value: !Ref EnvironmentName

  FeedFlowNotificationsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Funcao de execucao exclusiva da Lambda de notificacoes do FeedFlow.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: FeedFlowNotificationsStreamRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadFeedbackStream
                Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !GetAtt FeedFlowFeedbackTable.StreamArn
              - Sid: ListFeedbackStreams
                Effect: Allow
                Action:
                  - dynamodb:ListStreams
                Resource: '*'
        - PolicyName: FeedFlowNotificationsPublishAlert
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishCriticalAlert
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FeedFlowCriticalAlertsTopic
        - PolicyName: FeedFlowNotificationsFailureDestination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SendDiscardedBatchMetadata
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt FeedFlowNotificationsFailureQueue.Arn
        - PolicyName: FeedFlowNotificationsCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-notifications:log-stream:*'
      Tags:
        - Key: Application
          Value: FeedFlow
        - Key: Environment
          Value: !Ref EnvironmentName

  FeedFlowApiFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - FeedFlowApiLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Description: API HTTP do FeedFlow.
      CodeUri: feedflow-api/target/function.zip
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt FeedFlowApiExecutionRole.Arn
      Environment:
        Variables:
          FEEDFLOW_DYNAMODB_TABLE_NAME: !Ref FeedFlowFeedbackTable
          FEEDFLOW_DYNAMODB_QUERY_PAGE_SIZE: '100'
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedFlowHttpApi
            Path: /health
            Method: GET
            PayloadFormatVersion: '2.0'
        AvaliacaoRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedFlowHttpApi
            Path: /avaliacao
            Method: POST
            PayloadFormatVersion: '2.0'
      Tags:
        Application: FeedFlow
        Environment: !Ref EnvironmentName

  FeedFlowNotificationsFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - FeedFlowNotificationsLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-notifications'
      Description: Publica alertas SNS para novas avaliacoes criticas.
      CodeUri: feedflow-notifications/target/function.zip
      Handler: br.com.feedflow.notifications.handler.CriticalNotificationHandler::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 20
      Role: !GetAtt FeedFlowNotificationsExecutionRole.Arn
      Environment:
        Variables:
          FEEDFLOW_ALERT_TOPIC_ARN: !Ref FeedFlowCriticalAlertsTopic
      Events:
        FeedbackStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt FeedFlowFeedbackTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            Enabled: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt FeedFlowNotificationsFailureQueue.Arn
      Tags:
        Application: FeedFlow
        Environment: !Ref EnvironmentName

Outputs:
  ApiUrl:
    Description: URL base da HTTP API no stage padrao.
    Value: !Sub 'https://${FeedFlowHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'

  HealthUrl:
    Description: URL do endpoint de saude.
    Value: !Sub 'https://${FeedFlowHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health'

  AvaliacaoAsciiUrl:
    Description: URL oficial da avaliacao.
    Value: !Sub 'https://${FeedFlowHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/avaliacao'

  ApiFunctionName:
    Description: Nome da Lambda API.
    Value: !Ref FeedFlowApiFunction

  ApiExecutionRoleArn:
    Description: ARN da funcao IAM exclusiva da Lambda API.
    Value: !GetAtt FeedFlowApiExecutionRole.Arn

  FeedbackTable:
    Description: Nome da tabela DynamoDB.
    Value: !Ref FeedFlowFeedbackTable

  FeedbackTableStreamArn:
    Description: ARN do DynamoDB Stream consumido pela Lambda de notificacoes.
    Value: !GetAtt FeedFlowFeedbackTable.StreamArn

  ApiLogGroup:
    Description: Log group da Lambda API.
    Value: !Ref FeedFlowApiLogGroup

  NotificationsFunctionName:
    Description: Nome da Lambda de notificacoes criticas.
    Value: !Ref FeedFlowNotificationsFunction

  NotificationsExecutionRoleArn:
    Description: ARN da funcao IAM exclusiva da Lambda de notificacoes.
    Value: !GetAtt FeedFlowNotificationsExecutionRole.Arn

  CriticalAlertsTopicArn:
    Description: ARN do topico SNS de alertas criticos, sem assinatura criada automaticamente.
    Value: !Ref FeedFlowCriticalAlertsTopic

  NotificationsFailureQueueUrl:
    Description: URL da fila que recebe metadados de lotes descartados apos os retries.
    Value: !Ref FeedFlowNotificationsFailureQueue

  NotificationsLogGroup:
    Description: Log group da Lambda de notificacoes.
    Value: !Ref FeedFlowNotificationsLogGroup
